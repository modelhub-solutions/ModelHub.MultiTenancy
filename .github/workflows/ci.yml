name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release
      - run: dotnet pack src/ModelHub.MultiTenancy -c Release --no-build -o artifacts
      - run: dotnet pack src/ModelHub.MultiTenancy.EntityFrameworkCore -c Release --no-build -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts
          retention-days: 7

  publish:
    # Publishes to NuGet when a tag like v0.1.0 is pushed, using nuget.org Trusted Publishing:
    # GitHub's OIDC token is exchanged for a short-lived API key, so no long-lived key is stored.
    # Needs a nuget.org trusted publishing policy for this repo and ci.yml, and the NUGET_USER
    # secret (your nuget.org profile name, not your email).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: NuGet login (Trusted Publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
